[workspace]
resolver = "2"
members = [
    "crates/nvos-core",
    "crates/nvos-cpu",
    "crates/nvos-mem",
    "crates/nvos-fs",
    "crates/nvos-io",
    "crates/nvos-kernel",
    "crates/nvos-trace",
    "crates/nvos-scenario",
    "crates/nvos-tui",
    "crates/nvos-web",
    "crates/nvos-cli",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
authors      = ["cristiano-s-r-filho"]
license      = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Core async
tokio        = { version = "1", features = ["full"] }
# Serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"
# TUI
ratatui      = "0.29"
crossterm    = "0.28"
# Web / Dioxus
dioxus       = { version = "0.6", features = ["router"] }
axum         = "0.8"
tower-http   = { version = "0.6", features = ["fs", "cors"] }
# Data structures
slotmap      = "1"
# RNG
rand_chacha  = "0.3"
rand         = "0.8"
# Embed assets
rust-embed   = { version = "8", features = ["interpolate-folder-path"] }
# CLI
clap         = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic    = { level = "warn", priority = -1 }
all         = { level = "warn", priority = -1 }

[profile.dev]
opt-level   = 0
debug       = true

[profile.release]
opt-level   = 3
lto         = "thin"
strip       = "debuginfo"
