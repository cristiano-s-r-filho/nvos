[package]
name    = "nvos-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
nvos-core   = { path = "../nvos-core", features = ["serde"] }
nvos-kernel = { path = "../nvos-kernel" }
nvos-trace  = { path = "../nvos-trace" }
dioxus      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }

# Native-only (server-side) — not linked when compiling to wasm32
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum        = { workspace = true }
tower-http  = { workspace = true }
tokio       = { workspace = true }
rust-embed  = { workspace = true }

# WASM-only — not linked when compiling natively
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus-web  = { version = "0.6" }

[dev-dependencies]
